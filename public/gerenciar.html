<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Gerenciar carinho · Tetê Atelier Sucré</title>
  <meta name="theme-color" content="#f7f0e3">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilo.css">
  <script type="module" src="/js/gerenciar.js"></script>
</head>
<body>
  <main class="pagina">
    <a class="marca" href="/" aria-label="Tetê Atelier Sucré — início">
      <span class="marca-nome">Tetê</span>
      <span class="marca-sub">Atelier Sucré</span>
    </a>
    <section class="etapa" id="conteudo" tabindex="-1" aria-live="polite">
      <div class="carregando"><div><div class="giro"></div>Carregando…</div></div>
    </section>
  </main>
  <dialog id="confirmar" aria-labelledby="t-confirmar">
    <h2 id="t-confirmar">Excluir este carinho?</h2>
    <p class="nota">O áudio ou bilhete será apagado agora, e o link deixará de funcionar para quem recebeu. Não é possível desfazer.</p>
    <div class="acoes">
      <button type="button" class="botao botao-principal" id="confirmar-excluir">Sim, excluir</button>
      <button type="button" class="botao botao-secundario" id="cancelar-excluir">Manter</button>
    </div>
  </dialog>
  <footer class="rodape">
    <p class="rodape-frase">Celebre o que torna a vida mais doce.</p>
    <p class="rodape-marca">Tetê Atelier Sucré</p>
  </footer>
</body>
</html>
